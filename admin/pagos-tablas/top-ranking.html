<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ranking Top 3 por Rifa</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 0 16px rgba(0,0,0,0.09);
      text-align: center;
    }

    h2 {
      color: #0077cc;
      margin-bottom: 18px;
    }

    select {
      min-width: 160px;
      padding: 8px 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-bottom: 32px;
    }

    .ranking-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 18px;
      margin-top: 40px;
    }

    .place-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      width: 150px;
      min-height: 220px;
      background: #f8fafc;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding-bottom: 10px;
      transition: transform 0.18s;
    }

    .place-col.gold { height: 270px; background: linear-gradient(180deg,#ffe066 60%,#fffbe6 100%); }
    .place-col.silver { height: 220px; background: linear-gradient(180deg,#f8f9fa 55%,#e9ecef 100%); }
    .place-col.bronze { height: 170px; background: linear-gradient(180deg,#f6d6bf 60%,#fff2e0 100%); }

    .place-badge {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .place-badge img {
      width: 100px;
      height: 100px;
    }

    .rank-number {
      font-size: 32px;
      font-weight: bold;
      margin-top: 6px;
      margin-bottom: 6px;
      color: #0077cc;
      text-shadow: 1px 1px 0 #fff;
    }

    .user-name {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #444;
      text-shadow: 1px 1px 0 #fffbe6;
    }

    .user-dni {
      font-size: 13px;
      color: #777;
      margin-bottom: 3px;
    }

    .tickets, .spent {
      font-size: 15px;
      color: #222;
    }

    .no-data {
      margin-top: 50px;
      font-size: 18px;
      color: #888;
    }

    .ranking-table-section {
      margin-top: 50px;
      text-align: left;
    }
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      background: #f8fafc;
      border-radius: 8px;
      overflow: hidden;
      font-size: 15px;
    }
    .ranking-table th, .ranking-table td {
      border: 1px solid #e2e2e2;
      padding: 10px 6px;
      text-align: left;
    }
    .ranking-table th {
      background-color: #0077cc;
      color: white;
      font-weight: 500;
    }
    .ranking-table tr:nth-child(even) {
      background-color: #f5f5f5;
    }
    .ranking-table tr:hover {
      background-color: #e3eefa;
    }
    .ranking-table .position {
      font-weight: bold;
      color: #0077cc;
      text-align: center;
    }
    @media (max-width: 600px) {
      .ranking-row { flex-direction: column; gap: 28px; }
      .place-col { width: 90%; max-width: 270px; }
      .ranking-table-section { font-size: 13px; }
      .ranking-table th, .ranking-table td { padding: 7px 4px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Top 3 compradores por rifa</h2>
  <label for="raffle-select"><strong>Selecciona una rifa:</strong></label>
  <select id="raffle-select" onchange="onRaffleChange()">
    <option value="">-- Rifa --</option>
  </select>

  <div id="ranking-row" class="ranking-row"></div>
  <div id="no-data" class="no-data" style="display:none;">No hay datos para esta rifa.</div>

  <div id="ranking-table-section" class="ranking-table-section" style="display:none;">
    <h3 style="margin-bottom:5px;">Otros participantes del ranking</h3>
    <table id="ranking-table" class="ranking-table">
      <thead>
        <tr>
          <th>Posición</th>
          <th>Nombre</th>
          <th>Cédula</th>
          <th>Tickets</th>
          <th>Monto</th>
        </tr>
      </thead>
      <tbody id="ranking-table-body"></tbody>
    </table>
  </div>
</div>

<script>
  // IMAGENES: Puedes cambiar por las tuyas según tu estilo.
  const placeImgs = {
    1: 'top-1.png', // Trofeo oro
    2: 'top-2.png', // Trofeo plata
    3: 'top-3.png', // Trofeo bronce
  };
  // Endpoints
  const RAFFLES_API_URL = 'https://api.ganaconlosprimos.com/raffles';
  const RANKING_API_URL = 'https://api.ganaconlosprimos.com/payments/top-ranking'; // <--- Debes tener este endpoint
  const TOKEN = 'technohammerAdmin';
  const TOKENPUBLIC = 'technohammer';

  async function loadRaffles() {
    try {
      const res = await fetch(RAFFLES_API_URL, {
        headers: { 'Authorization': 'Bearer ' + TOKENPUBLIC }
      });
      const raffles = await res.json();
      const select = document.getElementById('raffle-select');
      raffles.filter(r => !r.isHidden).forEach(r => {
        const option = document.createElement('option');
        option.value = r.id;
        option.textContent = r.name;
        select.appendChild(option);
      });
    } catch (err) {
      console.error('Error al cargar rifas:', err);
    }
  }

  async function loadRanking(raffleId) {
    document.getElementById('ranking-row').innerHTML = '';
    document.getElementById('no-data').style.display = 'none';
    document.getElementById('ranking-table-section').style.display = 'none';
    if (!raffleId) return;
    try {
      const res = await fetch(`${RANKING_API_URL}/${raffleId}`, {
        headers: { 'Authorization': 'Bearer ' + TOKEN }
      });
      const data = await res.json();
      displayTopRanking(data);
      displayTableRanking(data);
    } catch (err) {
      console.error('Error al obtener ranking:', err);
      document.getElementById('no-data').style.display = '';
    }
  }

  function onRaffleChange() {
    const raffleId = document.getElementById('raffle-select').value;
    if (raffleId) loadRanking(raffleId);
    else {
      document.getElementById('ranking-row').innerHTML = '';
      document.getElementById('no-data').style.display = 'none';
      document.getElementById('ranking-table-section').style.display = 'none';
    }
  }

  function displayTopRanking(data) {
    const top3 = data.slice(0, 3);
    if (top3.length === 0) {
      document.getElementById('ranking-row').innerHTML = '';
      document.getElementById('no-data').style.display = '';
      return;
    }
    // Orden visual correcto: Izq=2do, Centro=1ro, Der=3ro
    const order = [
      { idx: 1, place: 2, class: 'silver', img: placeImgs[2] },
      { idx: 0, place: 1, class: 'gold', img: placeImgs[1] },
      { idx: 2, place: 3, class: 'bronze', img: placeImgs[3] }
    ];

    const html = order.map(o => {
      const item = top3[o.idx];
      if (!item) return `<div class="place-col ${o.class}"></div>`;
      return `
        <div class="place-col ${o.class}">
          <div class="place-badge"><img src="${o.img}" alt="Trofeo ${o.place}"></div>
          <div class="rank-number">${o.place}</div>
          <div class="user-name">${item.user.fullName}</div>
          <div class="user-dni">C.I: ${item.user.dni}</div>
          <div class="tickets">Tickets: <strong>${item.ticketsBought}</strong></div>
          <div class="spent">Gastado: <strong>${item.totalSpent} Bs</strong></div>
        </div>
      `;
    }).join('');
    document.getElementById('ranking-row').innerHTML = html;
  }

  function displayTableRanking(data) {
    const tableSection = document.getElementById('ranking-table-section');
    const tbody = document.getElementById('ranking-table-body');
    const tableData = data.slice(3, 10); // Los puestos 4 a 10

    if (tableData.length === 0) {
      tableSection.style.display = 'none';
      return;
    }

    tbody.innerHTML = tableData.map((item, i) => `
      <tr>
        <td class="position">${i + 4}</td>
        <td>${item.user.fullName}</td>
        <td>${item.user.dni}</td>
        <td>${item.ticketsBought}</td>
        <td>${item.totalSpent} Bs</td>
      </tr>
    `).join('');
    tableSection.style.display = '';
  }

  // Inicializa rifas al cargar
  loadRaffles();
</script>
</body>
</html>
