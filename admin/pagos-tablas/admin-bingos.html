<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin - Bingos</title>

    <link rel="stylesheet" href="./assets/css/admin.css" />
  </head>

  <body>
    <!-- LOGIN -->

    <!--<div id="login-screen" class="login-screen">
      <div class="login-box">
        <h2>🎯 Acceso Admin</h2>

        <input
          type="password"

          class="btn btn-primary"

    <div id="login-screen" class="login-screen">
      <div class="login-box">
        <h2>🎯 Acceso Admin</h2>

        <input
          type="password"
          id="password"
          class="input"
          placeholder="Contraseña"
        />

        <button
          id="login-btn"
          class="btn btn-primary"
          style="width: 100%; margin-top: 10px"
        >
          Entrar
        </button>
      </div>
    </div>

    <!-- PANEL -->

    <div id="admin-panel" class="layout hidden">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <h2>🎯 Bingo Admin</h2>

        <nav>
          <a href="./admin-dashboard.html">📊 Dashboard</a>

          <a href="./admin-bingos.html" class="active">🎰 Bingos</a>

          <a href="./admin-tickets.html">🎟️ Tickets</a>

          <a href="./admin-payments.html">💳 Pagos</a>

          <a href="./admin-prizes.html">🏆 Premios</a>
        </nav>

        <button class="logout-btn">Cerrar sesión</button>
      </aside>

      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <!-- CONTENT -->

      <main class="content">
        <div class="topbar">
          <button class="menu-toggle">☰</button>
          <h1>Administración de Bingos</h1>
        </div>

        <div class="card">
          <!-- FILTERS -->

          <div class="filters">
            <input
              type="text"
              id="search-input"
              class="input"
              placeholder="Buscar bingo..."
            />

            <select id="status-filter" class="select">
              <option value="">Todos</option>

              <option value="active">Activos</option>

              <option value="inactive">Inactivos</option>
            </select>
          </div>

          <!-- TABLE -->

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Banner</th>
                  <th>Nombre</th>
                  <th>Precio</th>
                  <th>Tickets</th>
                  <th>Activo</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="table-body"></tbody>
            </table>
          </div>

          <div id="pagination" class="pagination"></div>
        </div>
      </main>
    </div>

    <!-- FAB -->

    <!--<button class="fab" onclick="openModal()">+</button>-->
    <button id="fab-button" class="fab hidden">+</button>

    <!-- MODAL -->

    <div id="modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Crear Bingo</h2>

          <button class="close-btn">×</button>
        </div>

        <form id="bingo-form">
          <div class="modal-body">
            <div class="form-group">
              <label>Nombre</label>

              <input
                type="text"
                id="name"
                class="input"
                placeholder="Nombre del bingo"
                maxlength="191"
              />
            </div>

            <div class="form-group">
              <label>Descripción</label>

              <textarea
                id="description"
                class="textarea"
                placeholder="Descripción"
                maxlength="500"
              ></textarea>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label>Precio</label>

                <input
                  type="number"
                  id="price"
                  class="input"
                  placeholder="0.00"
                  min="0.01"
                  step="0.01"
                />
              </div>

              <div class="form-group">
                <label>Total tickets</label>

                <input
                  type="number"
                  id="maxTickets"
                  class="input"
                  placeholder="300"
                  min="1"
                  max="100000"
                />
              </div>

              <div class="form-group">
                <label>Máximo por usuario</label>

                <input
                  type="number"
                  id="maxTicketsBuy"
                  class="input"
                  placeholder="10"
                  min="1"
                />
              </div>
            </div>

            <div class="form-group">
              <label>Opciones</label>

              <div class="checkbox-grid">
                <label class="checkbox-item">
                  <input type="checkbox" id="isActive" checked />
                  Activo
                </label>

                <label class="checkbox-item">
                  <input type="checkbox" id="isRandomized" />
                  Aleatorio
                </label>

                <label class="checkbox-item">
                  <input type="checkbox" id="isHidden" />
                  Oculto
                </label>
              </div>
            </div>

            <div class="form-group">
              <label>Banner</label>

              <input type="file" id="banner" class="input" accept="image/*" />

              <div class="preview-wrapper">
                <img id="preview" class="preview hidden" />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary">Cancelar</button>

            <button type="submit" class="btn btn-success">Crear Bingo</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./assets/js/app.js"></script>

    <!-- IMAGE PREVIEW MODAL -->
    <div id="image-modal" class="image-modal" onclick="closeImageModal()">
      <div class="image-modal-content" onclick="event.stopPropagation()">
        <button class="image-modal-close" onclick="closeImageModal()">✕</button>

        <img id="image-modal-src" src="" alt="Banner ampliado" />
      </div>
    </div>
  </body>
</html>
