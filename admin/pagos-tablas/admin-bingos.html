<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin - Bingos</title>

    <link rel="stylesheet" href="./assets/css/admin.css" />
  </head>

  <body>
    <!-- PANEL -->

    <div id="admin-panel" class="layout">
      <!-- SIDEBAR -->

      <div id="sidebar-container"></div>

      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <!-- CONTENT -->

      <main class="content">
        <div id="topbar-container"></div>

        <div class="card">
          <!-- FILTERS -->

          <div class="filters">
            <input
              type="text"
              id="search-input"
              class="input"
              placeholder="Buscar bingo..."
            />

            <select id="status-filter" class="select">
              <option value="">Todos</option>

              <option value="active">Activos</option>

              <option value="inactive">Inactivos</option>
            </select>
          </div>

          <!-- TABLE -->

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Banner</th>
                  <th>Nombre</th>
                  <th>Precio</th>
                  <th>Tickets</th>
                  <th>Activo</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="table-body"></tbody>
            </table>
          </div>

          <div id="pagination" class="pagination"></div>
        </div>
      </main>
    </div>

    <div id="image-modal-container"></div>

    <!-- FAB -->

    <!--<button class="fab" onclick="openModal()">+</button>-->
    <button id="fab-button" class="fab">+</button>

    <!-- MODAL -->

    <div id="modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Crear Bingo</h2>

          <button class="close-btn">×</button>
        </div>

        <form id="bingo-form">
          <div class="modal-body">
            <div class="form-group">
              <label>Nombre</label>

              <input
                type="text"
                id="name"
                class="input"
                placeholder="Nombre del bingo"
                maxlength="191"
              />
            </div>

            <div class="form-group">
              <label>Descripción</label>

              <textarea
                id="description"
                class="textarea"
                placeholder="Descripción"
                maxlength="500"
              ></textarea>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label>Precio</label>

                <input
                  type="number"
                  id="price"
                  class="input"
                  placeholder="0.00"
                  min="0.01"
                  step="0.01"
                />
              </div>

              <div class="form-group">
                <label>Total tickets</label>

                <input
                  type="number"
                  id="maxTickets"
                  class="input"
                  placeholder="300"
                  min="1"
                  max="100000"
                />
              </div>

              <div class="form-group">
                <label>Máximo por usuario</label>

                <input
                  type="number"
                  id="maxTicketsBuy"
                  class="input"
                  placeholder="10"
                  min="1"
                />
              </div>
            </div>

            <div class="form-group">
              <label>Opciones</label>

              <div class="checkbox-grid">
                <label class="checkbox-item">
                  <input type="checkbox" id="isActive" checked />
                  Activo
                </label>

                <label class="checkbox-item">
                  <input type="checkbox" id="isRandomized" />
                  Aleatorio
                </label>

                <label class="checkbox-item">
                  <input type="checkbox" id="isHidden" />
                  Oculto
                </label>
              </div>
            </div>

            <div class="form-group">
              <label>Banner</label>

              <input type="file" id="banner" class="input" accept="image/*" />

              <div class="preview-wrapper">
                <img id="preview" class="preview hidden" />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary">Cancelar</button>

            <button type="submit" class="btn btn-success">Crear Bingo</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- SIDEBAR -->
    <script type="module">
      import { renderAdminSidebar } from "./assets/js/components/admin-sidebar.js";

      document.getElementById("sidebar-container").innerHTML =
        renderAdminSidebar("bingos");
    </script>

    <!-- TOPBAR -->
    <script type="module">
      import { renderTopbar } from "./assets/js/components/topbar.component.js";

      document.getElementById("topbar-container").innerHTML = renderTopbar(
        "Administración de Bingos",
      );
    </script>

    <!-- IMAGE MODAL -->
    <script type="module">
      import {
        renderImageModal,
        initImageModalEvents,
      } from "./assets/js/components/image-modal.component.js";

      document.getElementById("image-modal-container").innerHTML =
        renderImageModal();

      initImageModalEvents();
    </script>

    <!-- APP -->
    <script type="module">
      import { requireAdminAuth } from "./assets/js/guards/admin.guard.js";
      import { initApp } from "./assets/js/app.js";

      const allowed = requireAdminAuth();

      if (allowed) {
        initApp("./pages/admin-bingos.js", "initBingos");
      }
    </script>
  </body>
</html>
