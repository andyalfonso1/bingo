<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin - Tickets</title>

    <link rel="stylesheet" href="./assets/css/admin.css" />
  </head>

  <body>
    <!-- PANEL -->

    <div id="admin-panel" class="layout">
      <!-- SIDEBAR -->

      <div id="sidebar-container"></div>

      <!-- OVERLAY -->

      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <!-- CONTENT -->

      <main class="content">
        <!-- TOPBAR -->

        <div id="topbar-container"></div>

        <!-- CARD -->

        <div class="card">
          <!-- FILTERS -->

          <div class="filters">
            <select id="bingo-filter" class="select">
              <option value="">Seleccionar bingo</option>
            </select>

            <input
              type="text"
              id="search-input"
              class="input"
              placeholder="Buscar ticket..."
            />
          </div>

          <!-- TABLE -->

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>

                  <th>Número</th>

                  <th>Estado</th>

                  <th>Imagen</th>

                  <th>Usuario</th>

                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="table-body"></tbody>
            </table>
          </div>

          <div id="pagination" class="pagination"></div>
        </div>
      </main>
    </div>

    <!-- IMAGE MODAL -->

    <div id="image-modal-container"></div>

    <!-- SWEETALERT -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
      import { renderAdminSidebar } from "./assets/js/components/admin-sidebar.js";

      document.getElementById("sidebar-container").innerHTML =
        renderAdminSidebar("tickets");
    </script>

    <script type="module">
      import { renderTopbar } from "./assets/js/components/topbar.component.js";

      document.getElementById("topbar-container").innerHTML = renderTopbar(
        "Administración de Tickets",
      );
    </script>

    <script type="module">
      import {
        renderImageModal,
        initImageModalEvents,
      } from "./assets/js/components/image-modal.component.js";

      document.getElementById("image-modal-container").innerHTML =
        renderImageModal();

      initImageModalEvents();
    </script>

    <!-- APP -->

    <script type="module">
      import { requireAdminAuth } from "./assets/js/guards/admin.guard.js";
      import { initApp } from "./assets/js/app.js";

      const allowed = requireAdminAuth();

      if (allowed) {
        initApp("./pages/admin-bingo-tickets.js", "initTickets");
      }
    </script>
  </body>
</html>
